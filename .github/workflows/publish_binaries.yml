name: Publish site binaries

# Refreshes the downloads that trydoorstep.vercel.app serves from the Vercel
# Blob store, using the most recent successful "Build all platforms" run.
#
# Use this when the binaries already exist and only the website needs to pick
# them up — for example after a partial upload or a renamed artifact. It never
# builds anything itself; run "Build all platforms" first if there is no run
# with artifacts yet.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional: a specific build run to publish from (defaults to the newest one with all 6 artifacts)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Find the newest build run with artifacts
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.run_id }}" ]; then
            RUN_ID="${{ inputs.run_id }}"
          else
            # Take the newest build run whose artifacts are all present —
            # a run is skipped here if only its *publish* step failed.
            RUN_ID=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow build_all.yml \
              --limit 20 \
              --json databaseId,headBranch \
              --jq '[.[] | select(.headBranch != "")][0].databaseId')
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No 'Build all platforms' run found. Run that workflow first."
            exit 1
          fi
          echo "Using run $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download "${{ steps.latest.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist
          # gh nests each artifact in a folder of the same name; flatten it.
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
          # Normalize names to the current version so the bucket always serves
          # the newest build regardless of what version the artifacts were
          # named with at build time.
          VERSION=$(grep '^version:' app/pubspec.yaml | sed 's/version: \([0-9.]*\).*/\1/')
          echo "Normalizing artifact names to version $VERSION"
          for f in dist/*; do
            base=$(basename "$f")
            if echo "$base" | grep -q "Doorstep-[0-9][0-9]*\.[0-9]"; then
              new=$(echo "$base" | sed "s/Doorstep-[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*/Doorstep-$VERSION/")
              if [ "$base" != "$new" ]; then mv "$f" "dist/$new"; fi
            fi
          done
          echo "--- files ready for upload ---"
          ls -la dist

      - name: Upload to the Vercel Blob bucket
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "::error::BLOB_READ_WRITE_TOKEN is not set — add it as a repository secret."
            exit 1
          fi
          shopt -s nullglob
          for file in dist/*; do
            echo "Uploading $(basename "$file")"
            npx --yes vercel@latest blob put "$file" \
              --access public \
              --allow-overwrite true \
              --pathname "$(basename "$file")" \
              --token "$BLOB_READ_WRITE_TOKEN"
          done
          echo "All uploads finished."
