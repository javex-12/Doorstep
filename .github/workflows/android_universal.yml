name: Android Universal APK

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.9"
  RUST_VERSION: "1.93.1"
  BUILD_DIR: "/tmp/build"

jobs:
  build_android_universal:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Copy files to build directory
        run: |
          mkdir -p "$BUILD_DIR"
          cp -r . "$BUILD_DIR"

      - name: Decode key.properties
        working-directory: ${{ env.BUILD_DIR }}
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: echo "$ENCODED_STRING" | base64 -di > app/android/key.properties

      - name: Decode Android keystore
        working-directory: ${{ env.BUILD_DIR }}
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          mkdir -p app/android/secrets
          echo "$ENCODED_STRING" | base64 -di > app/android/secrets/android-keystore.jks
          if grep -q '^storeFile=' app/android/key.properties; then
            sed -i 's|^storeFile=.*|storeFile=../secrets/android-keystore.jks|' app/android/key.properties
          else
            echo 'storeFile=../secrets/android-keystore.jks' >> app/android/key.properties
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: ${{ env.RUST_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.BUILD_DIR }}/app
        run: flutter pub get

      - name: Build universal APK
        working-directory: ${{ env.BUILD_DIR }}/app
        run: flutter build apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v6
        with:
          name: doorstep-android-universal-apk
          path: ${{ env.BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-release.apk
