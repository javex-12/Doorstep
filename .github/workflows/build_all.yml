name: Build all platforms

# One button for every platform Doorstep ships on. iOS, macOS and Linux cannot
# be built from a Windows machine, so these jobs run on GitHub's own runners.
#
# - Run it manually from the Actions tab (workflow_dispatch).
# - Or push a tag like `v1.0.0` to also publish everything to GitHub Releases
#   and to the Vercel Blob store that trydoorstep.vercel.app serves from.
#
# Requiring the publish step: add a repository secret named
# BLOB_READ_WRITE_TOKEN (Vercel → Storage → your Blob store → Tokens).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  # ── Metadata ────────────────────────────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        working-directory: app
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Doorstep v$VERSION"

  # ── Android — one universal APK that runs on every phone ────────────────────
  android:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The FOSS build: drops the in-app purchase / donation code so the APK is
      # reproducible and store-safe.
      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build universal APK
        working-directory: app
        run: flutter build apk --release

      - name: Rename artifact
        working-directory: app
        run: cp build/app/outputs/flutter-apk/app-release.apk "Doorstep-${{ needs.version.outputs.version }}-universal.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: android-universal
          path: app/Doorstep-${{ needs.version.outputs.version }}-universal.apk
          if-no-files-found: error

  # ── Windows — portable zip + Inno Setup installer ──────────────────────────
  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Enable long file paths
        shell: pwsh
        run: git config --system core.longpaths true

      - uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Suppress deprecated MSVC coroutine diagnostic
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value 'CXXFLAGS=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS'

      - name: Build Windows application
        working-directory: app
        run: flutter build windows --release

      - name: Bundle the Visual C++ runtime
        working-directory: app
        shell: pwsh
        run: |
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            Copy-Item "../support/build/windows/x64/$dll" build/windows/x64/runner/Release/
          }

      - name: Create portable zip
        working-directory: app
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "Doorstep-${{ needs.version.outputs.version }}-Windows-x64.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item -Path app/build/windows/x64/runner/Release/* -Destination staging -Recurse
          Copy-Item -Path app/assets/packaging/logo.ico -Destination staging
          Copy-Item -Path app/assets/packaging/wizard.bmp -Destination staging
          Copy-Item -Path app/assets/packaging/wizard-small.bmp -Destination staging
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DStagingDir=${{ github.workspace }}\staging" `
            "/DOutputDir=${{ github.workspace }}\dist" `
            "/DMyAppVersion=${{ needs.version.outputs.version }}" `
            support\scripts\compile_windows_exe-inno.ci.iss
          Copy-Item -Path dist\*.exe -Destination "app\Doorstep-${{ needs.version.outputs.version }}-Setup.exe"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          path: |
            app/Doorstep-${{ needs.version.outputs.version }}-Windows-x64.zip
            app/Doorstep-${{ needs.version.outputs.version }}-Setup.exe
          if-no-files-found: error

  # ── Linux — AppImage ────────────────────────────────────────────────────────
  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libfuse2

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Linux
        working-directory: app
        run: flutter build linux --release

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir
          cp -r app/build/linux/x64/release/bundle/* AppDir/
          for size in 32 128 256; do
            mkdir -p "AppDir/usr/share/icons/hicolor/${size}x${size}/apps"
            cp "app/assets/img/logo-${size}.png" "AppDir/usr/share/icons/hicolor/${size}x${size}/apps/doorstep.png"
          done
          cp support/build/appimage/AppImageBuilder_x86_64.yml AppImageBuilder.yml

      - name: Build AppImage
        uses: AppImageCrafters/build-appimage@57c3bc6963f870ce3be103117de5b5e33ffbaeb6
        with:
          recipe: ./AppImageBuilder.yml

      - name: Rename AppImage
        run: |
          BUILT=$(ls ./*.AppImage | head -1)
          mv "$BUILT" "Doorstep-${{ needs.version.outputs.version }}-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v6
        with:
          name: linux-x64
          path: Doorstep-${{ needs.version.outputs.version }}-linux-x86_64.AppImage
          if-no-files-found: error

  # ── macOS — universal (Apple Silicon + Intel) ───────────────────────────────
  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets for a universal build
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build macOS app (universal)
        working-directory: app
        run: flutter build macos --release

      # Ad-hoc sign so the app launches on Apple Silicon without a Developer ID.
      - name: Ad-hoc re-sign
        working-directory: app
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          echo "Signing $APP"
          codesign --force --deep --sign - --entitlements macos/Runner/Release.entitlements "$APP" || true

      - name: Package .app as zip
        working-directory: app/build/macos/Build/Products/Release
        run: |
          APP=$(find . -maxdepth 1 -name '*.app' | head -1)
          ditto -c -k --keepParent "$APP" "$GITHUB_WORKSPACE/Doorstep-${{ needs.version.outputs.version }}-macos-universal.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: macos-universal
          path: Doorstep-${{ needs.version.outputs.version }}-macos-universal.zip
          if-no-files-found: error

  # ── iOS — unsigned, no Apple Developer account needed ───────────────────────
  ios:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add iOS Rust targets
        run: rustup target add aarch64-apple-ios x86_64-apple-ios

      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Dependencies
        working-directory: app
        run: |
          flutter pub get
          cd ios && pod install --repo-update

      - name: Build iOS (unsigned)
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned .ipa
        working-directory: app
        run: |
          APP=$(find build/ios/iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "Packaging $APP"
          rm -rf build/ios/ipa && mkdir -p build/ios/ipa/Payload
          cp -r "$APP" build/ios/ipa/Payload/
          cd build/ios/ipa && zip -qry "$GITHUB_WORKSPACE/Doorstep-${{ needs.version.outputs.version }}-iOS-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v6
        with:
          name: ios-unsigned
          path: Doorstep-${{ needs.version.outputs.version }}-iOS-unsigned.ipa
          if-no-files-found: error

  # ── Publish — tags only ─────────────────────────────────────────────────────
  publish:
    needs: [version, android, windows, linux, macos, ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download every artifact
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Show what will be published
        run: ls -la artifacts

      # The site (trydoorstep.vercel.app) reads these from the Blob store, so a
      # new build is live without touching the site or redeploying it.
      - name: Publish to the Vercel Blob store
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "BLOB_READ_WRITE_TOKEN is not set — skipping the bucket upload."
            exit 0
          fi
          find artifacts -type f | while read -r file; do
            echo "Uploading $(basename "$file")"
            npx --yes vercel@latest blob put "$file" \
              --access public --allow-overwrite true \
              --pathname "$(basename "$file")" \
              --token "$BLOB_READ_WRITE_TOKEN"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Doorstep ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: artifacts/**/*
